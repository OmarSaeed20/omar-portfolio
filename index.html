  <!-- Prevent FOUC: Apply theme class before React hydrates. Must match ThemeProvider logic: honor prefers-color-scheme when no stored value. -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var light = s === 'light' ||
          (s !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        var r = document.documentElement;
        r.classList.toggle('light', light);
        r.classList.toggle('dark', !light);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', light ? '#ffffff' : '#000000');
      } catch (e) {}
    })();
  </script>
